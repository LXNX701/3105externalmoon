name: Build Moon Place IPA (sin Mac)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verificar recursos de parches
        shell: bash
        run: |
          set -euo pipefail
          count=$(find ThreeOneOSFive/moonplace/MoonV2Patches -type f -name '*.3105' | wc -l | tr -d ' ')
          if [ "$count" -ne 16 ]; then
            echo "Se esperaban 16 paquetes .3105 y se encontraron $count"
            exit 1
          fi
          if grep -R -q '^version https://git-lfs.github.com/spec/v1' ThreeOneOSFive/moonplace/MoonV2Patches; then
            echo "Git LFS no descargó los paquetes .3105"
            exit 1
          fi

      - name: Compilar 3105/Moon Place (sin firmar)
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build/Build/Products" \
            OBJROOT="$PWD/build/Build/Intermediates" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar IPA sin firmar
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/3105.app" Payload/
          zip -qr MoonPlace-unsigned.ipa Payload
          ls -lh MoonPlace-unsigned.ipa

      - name: Subir IPA como artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonPlace-unsigned-ipa
          path: MoonPlace-unsigned.ipa
          retention-days: 14
